name: ci

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The core promise: the app works with no backend. The test suite runs
      # entirely on LocalIntelligence (offline stub) — if it ever needs a live
      # backend to pass, that's a regression of the local-first guarantee.

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest # fast lanes only (integration/e2e excluded by default)
      - run: uv run lint-imports # separation contracts (CLAUDE.md Part III)
