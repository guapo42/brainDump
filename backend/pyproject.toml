[project]
name = "brain-dump"
version = "0.0.0"
description = "Brain Dump — optional intelligence service behind The External Lobe"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: fast, no external services",
    "contract: store-protocol contract suite (in-memory; later vs Neo4j under integration)",
    "integration: requires Docker services (Neo4j/Chroma)",
    "e2e: requires a live local LLM server (opt-in)",
]
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["brain_dump", "sim", "tests"]

# --- Separation rules, enforced by import-linter (see CLAUDE.md Part III) ---
[tool.importlinter]
root_packages = ["brain_dump", "sim"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "brain_dump must not import the simulation"
type = "forbidden"
source_modules = ["brain_dump"]
forbidden_modules = ["sim"]

[[tool.importlinter.contracts]]
name = "sim must not import infra (DBs, LLM clients, web, connectors)"
type = "forbidden"
source_modules = ["sim"]
forbidden_modules = [
    "neo4j",
    "chromadb",
    "openai",
    "instructor",
    "fastapi",
    "brain_dump.connectors",
]
